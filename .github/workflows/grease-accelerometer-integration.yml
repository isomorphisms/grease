name: grease-accelerometer-integration

on:
  pull_request:
    paths:
      - 'examples/accelerometer-inspection.ysh'
      - '.github/workflows/grease-accelerometer-integration.yml'
      - 'source'
  push:
    branches: [main]
    paths:
      - 'examples/accelerometer-inspection.ysh'
      - '.github/workflows/grease-accelerometer-integration.yml'
      - 'source'

permissions:
  contents: read

jobs:
  accelerometer-inspection:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Grease head and pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify exact Grease source pin
        id: source_pin
        shell: bash
        run: |
          revision=$(git rev-parse HEAD:source)
          test "$(git -C source rev-parse HEAD)" = "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Grease: $(git rev-parse HEAD)"
          echo "Oils-derived source: $revision"

      - name: Check out exact accelerometer producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          ref: c8e148889645113040f243d5d3c6801274eae3f1
          path: accelerometer-producer
          persist-credentials: false

      - name: Build deterministic producer
        shell: bash
        run: |
          set -eu
          producer="$GITHUB_WORKSPACE/accelerometer-producer"
          cc -std=c17 -O2 -Wall -Wextra -Werror -Wpedantic -Wshadow \
            -I"$producer/accelerometer/model" \
            -I"$producer/accelerometer/command" \
            "$producer/accelerometer/tests/inspection_fixture.c" \
            -lm \
            -o "$RUNNER_TEMP/accelerometer-inspection-fixture"

      - name: Pipe inspection through exact Grease implementation
        shell: bash
        run: |
          set -eu
          receipt="$RUNNER_TEMP/grease-accelerometer-receipt.txt"
          test -x source/bin/ysh
          "$RUNNER_TEMP/accelerometer-inspection-fixture" |
            source/bin/ysh examples/accelerometer-inspection.ysh |
            tee "$receipt"

          grep -Fqx 'android.x_m_per_s2=1.25' "$receipt"
          grep -Fqx 'compact.encode_status=ok' "$receipt"
          grep -Fqx 'PASS Grease consumed accelerometer inspection' "$receipt"

      - name: Prove a missing required field is rejected
        shell: bash
        run: |
          set -eu
          good="$RUNNER_TEMP/accelerometer-inspection-good.tsv"
          bad="$RUNNER_TEMP/accelerometer-inspection-missing-status.tsv"
          "$RUNNER_TEMP/accelerometer-inspection-fixture" > "$good"
          grep -v '^compact[.]encode_status	' "$good" > "$bad"

          if source/bin/ysh examples/accelerometer-inspection.ysh < "$bad"; then
            echo 'Grease consumer accepted an inspection record with compact.encode_status missing' >&2
            exit 1
          fi
