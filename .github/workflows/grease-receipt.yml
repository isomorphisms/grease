name: grease-receipt

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cpp-spec:
    runs-on: [self-hosted, linux, debian]
    timeout-minutes: 120
    steps:
      - name: Check out Grease and pinned Oils source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned source and Debian host
        shell: bash
        run: |
          revision=$(git rev-parse HEAD:source)
          test "$(git -C source rev-parse HEAD)" = "$revision"
          . /etc/os-release
          test "$ID" = debian
          echo "Grease source pin: $revision"
          echo "Debian: $PRETTY_NAME"

      - name: Prepare native Debian Oils environment
        working-directory: source
        shell: bash
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          soil/worker.sh JOB-dev-setup-debian

      - name: Run inherited Oils cpp-spec workload natively
        working-directory: source
        shell: bash
        run: |
          . build/dev-shell.sh
          soil/worker.sh JOB-cpp-spec
          soil/host-shim.sh did-all-succeed cpp-spec
