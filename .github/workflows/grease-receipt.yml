name: grease-receipt

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cpp-spec:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, debian]
    timeout-minutes: 120
    steps:
      - name: Check out Grease and pinned Oils source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned source and Debian host
        shell: bash
        run: |
          revision=$(git rev-parse HEAD:source)
          test "$(git -C source rev-parse HEAD)" = "$revision"
          . /etc/os-release
          test "$ID" = debian
          echo "Grease source pin: $revision"
          echo "Debian: $PRETTY_NAME"

      - name: Prepare native Debian Oils environment
        working-directory: source
        shell: bash
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          soil/worker.sh JOB-dev-setup-debian

      - name: Run inherited Oils cpp-spec workload natively
        working-directory: source
        shell: bash
        run: |
          . build/dev-shell.sh
          soil/worker.sh JOB-cpp-spec
          soil/host-shim.sh did-all-succeed cpp-spec

      - name: Build and run focused libc native tests
        working-directory: source
        shell: bash
        run: |
          . build/dev-shell.sh
          ninja _bin/cxx-dbg/cpp/libc_test
          _bin/cxx-dbg/cpp/libc_test -t grease_native_

      - name: Exercise mapped IB index from Grease
        working-directory: source
        shell: bash
        run: |
          . build/dev-shell.sh
          ninja _bin/cxx-asan+gcalways/ysh
          index_file=$(mktemp)
          trap 'rm -f "$index_file"' EXIT
          truncate -s 4096 "$index_file"
          printf fragment | dd of="$index_file" conv=notrunc status=none
          _bin/cxx-asan+gcalways/ysh \
            "$GITHUB_WORKSPACE/examples/ib-mapped-index.ysh" "$index_file"
          test "$(head -c 8 "$index_file")" = pensieve
